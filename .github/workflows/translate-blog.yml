name: Translate blog

on:
  push:
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run translate:blog
      - name: Commit translated blog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog-i18n
          git diff --staged --quiet || git commit -m "chore: update auto-translated blog locales"
          git push
